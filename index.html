<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Attendance Portal</title>
  <!-- QR Code generation library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Hardware Fingerprinting library to block incognito reuse -->
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
    .card { background: #ffffff; width: 100%; max-width: 440px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1a1a1a; font-size: 22px; text-align: center; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-top: 12px; margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #0066cc; }
    button { width: 100%; padding: 12px; background-color: #0066cc; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 18px; cursor: pointer; }
    button:disabled { background-color: #999; cursor: not-allowed; }
    #qrcode { display: flex; justify-content: center; margin: 20px 0; }
    .status-msg { margin-top: 15px; font-size: 14px; font-weight: 500; text-align: center; line-height: 1.4; }
    .session-info { background: #eaf3ff; border-left: 4px solid #0066cc; padding: 10px; border-radius: 4px; font-size: 13px; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <!-- VIEW A: TEACHER GENERATOR (Shown when opened directly) -->
    <div id="teacherView" style="display: none;">
      <h2>Generate Attendance QR</h2>
      <label for="sheetInput">Google Sheet Link or ID</label>
      <input type="text" id="sheetInput" placeholder="Paste link or ID here">

      <label for="startTime">Open Time</label>
      <input type="datetime-local" id="startTime">

      <label for="endTime">Close Time</label>
      <input type="datetime-local" id="endTime">

      <button onclick="generateQR()">Create Classroom QR</button>

      <div id="qrResult" style="display: none;">
        <div id="qrcode"></div>
        <div class="session-info" id="windowInfo"></div>
      </div>
    </div>

    <!-- VIEW B: STUDENT SUBMISSION FORM (Shown after scanning QR) -->
    <div id="studentView" style="display: none;">
      <h2>Record Attendance</h2>
      <form id="attendanceForm">
        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" required placeholder="e.g. 20261045">

        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="First and Last Name">

        <label for="group">Group Number</label>
        <input type="text" id="group" required placeholder="e.g. Group 2">

        <button type="submit" id="submitBtn">Submit</button>
      </form>
    </div>

    <p id="statusMsg" class="status-msg"></p>
  </div>

  <script>
    // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP DEPLOYMENT URL HERE:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyw-PcMqm3hPdIUIe96yU1fCcK16CP6bmBsenIlQGVqdQJbWo36NJVhY3Dq6hVcY2q9hQ/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const sheetId = urlParams.get("sheetId");
    const startMs = urlParams.get("start");
    const endMs = urlParams.get("end");

    // Route view: If URL has query params, render Student View. Otherwise, Teacher View.
    if (sheetId && startMs && endMs) {
      document.getElementById("studentView").style.display = "block";
      initStudentView();
    } else {
      document.getElementById("teacherView").style.display = "block";
    }

    // ==========================================
    // TEACHER LOGIC
    // ==========================================
    function extractSheetId(input) {
      const match = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : input.trim();
    }

    function generateQR() {
      const input = document.getElementById("sheetInput").value.trim();
      const startVal = document.getElementById("startTime").value;
      const endVal = document.getElementById("endTime").value;

      if (!input) return alert("Please enter a Google Sheet URL or ID.");
      if (!startVal || !endVal) return alert("Please select both Open and Close dates/times.");

      const sMs = new Date(startVal).getTime();
      const eMs = new Date(endVal).getTime();

      if (eMs <= sMs) return alert("Close time must be after Open time.");

      const cleanSheetId = extractSheetId(input);
      const cleanBaseUrl = window.location.origin + window.location.pathname;
      const studentUrl = `${cleanBaseUrl}?sheetId=${cleanSheetId}&start=${sMs}&end=${eMs}`;

      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = "";
      new QRCode(qrDiv, { text: studentUrl, width: 220, height: 220 });

      document.getElementById("windowInfo").innerHTML = `
        <b>Active Window:</b><br>
        🟢 Opens: ${new Date(sMs).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}<br>
        🔴 Closes: ${new Date(eMs).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}
      `;
      document.getElementById("qrResult").style.display = "block";
    }

    // ==========================================
    // STUDENT LOGIC & DEVICE FINGERPRINTING
    // ==========================================
    function getDeviceUUID() {
      let uuid = localStorage.getItem("att_device_uuid");
      if (!uuid) {
        uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        localStorage.setItem("att_device_uuid", uuid);
      }
      return uuid;
    }

    async function getBrowserFingerprint() {
      try {
        const fp = await FingerprintJS.load();
        const res = await fp.get();
        return res.visitorId;
      } catch (err) {
        return "fp_fallback_" + screen.width + "x" + screen.height;
      }
    }

    function initStudentView() {
      const now = Date.now();
      const s = parseInt(startMs, 10);
      const e = parseInt(endMs, 10);
      const msg = document.getElementById("statusMsg");

      if (now < s) {
        msg.style.color = "#d9534f";
        msg.innerText = "Attendance is not open yet. Opens: " + new Date(s).toLocaleString();
        document.getElementById("submitBtn").disabled = true;
      } else if (now > e) {
        msg.style.color = "#d9534f";
        msg.innerText = "Attendance window has closed for this session.";
        document.getElementById("submitBtn").disabled = true;
      }

      document.getElementById("attendanceForm").addEventListener("submit", async ev => {
        ev.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        msg.style.color = "#333";
        msg.innerText = "Recording attendance, please wait...";

        try {
          const payload = {
            sheetId: sheetId,
            startTime: startMs,
            endTime: endMs,
            studentId: document.getElementById("studentId").value.trim(),
            name: document.getElementById("name").value.trim(),
            group: document.getElementById("group").value.trim(),
            deviceUuid: getDeviceUUID(),
            deviceFp: await getBrowserFingerprint()
          };

          const res = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          if (data.status === "success") {
            msg.style.color = "#28a745";
            msg.innerText = data.message;
            document.getElementById("attendanceForm").reset();
          } else {
            msg.style.color = "#d9534f";
            msg.innerText = data.message;
            submitBtn.disabled = false;
          }
        } catch (err) {
          msg.style.color = "#d9534f";
          msg.innerText = "Submission failed: " + err.message;
          submitBtn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
